<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; worker-src blob:; connect-src https: http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
<title>個資遮罩工具</title>
<style>
:root{
  --bg:#eceff3; --panel:#ffffff; --ink:#1b2430; --sub:#5b6676; --line:#d5dbe3; --line2:#e6eaef;
  --pri:#0b5c70; --pri-d:#084a5b; --pri-t:#dff0f4;
  --mask:#232b37; --mask-t:#f3f5f8;
  --hl:#ffe27a; --warn:#fff4d6; --warn-b:#e5b93d; --err:#fde8e6; --err-b:#d4574c; --ok:#e3f4e8; --ok-b:#4a9d63; --info:#e8eef6; --info-b:#8aa3c4;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font)}
body.dragging::after{content:"放開滑鼠即可匯入";position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(11,92,112,.88);color:#fff;font-size:28px;font-weight:700;letter-spacing:.05em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:3px solid #4aa3ba;outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.5}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0}
.brand strong{font-size:18px;letter-spacing:.08em}
.brand span{color:var(--sub);font-size:13px}
.top-r{display:flex;gap:10px;align-items:center}
.ghost{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 14px}
.ghost:hover{background:#f4f6f9}
.ghost.small,.primary.small{padding:4px 12px}
.primary{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 20px;font-weight:700;letter-spacing:.03em}
.primary:hover:not(:disabled){background:var(--pri-d)}
.plain{background:none;border:0;color:var(--pri);padding:2px 6px;text-decoration:underline;text-underline-offset:3px}
.plain.danger{color:#a8372d}
.aichip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:4px 12px;font-size:13px}
.aichip .dot{width:9px;height:9px;border-radius:50%;background:#9aa5b4;display:inline-block}
.aichip.ready .dot{background:#2f9e5b}
.aichip.error .dot{background:#d4574c}
.aichip.offline{color:var(--sub);background:#f0f2f5}
.aichip.unconfigured .dot{background:#e0a92a}

main{max-width:1500px;margin:0 auto;padding:18px 20px 40px}
.stage-empty{max-width:760px;padding-top:7vh}
.drop{border:2px dashed #8fa1b5;border-radius:16px;background:var(--panel);padding:64px 28px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop:focus-visible{border-color:var(--pri);background:#f7fbfc}
.drop-title{font-size:30px;font-weight:700;letter-spacing:.04em}
.drop-sub{margin-top:6px;color:var(--sub);font-size:16px}
.drop-default{margin-top:22px;display:inline-block;padding:6px 14px;background:var(--pri-t);border-radius:8px;color:var(--pri-d);font-size:14px}
.assure{margin:22px 4px 0;padding-left:20px;color:var(--sub)}
.assure li{margin:4px 0}

.banner{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;max-width:1500px;margin:12px auto 0;padding:10px 16px;border-radius:10px;border:1px solid;font-size:14px}
.banner.error{background:var(--err);border-color:var(--err-b)}
.banner.warn{background:var(--warn);border-color:var(--warn-b)}
.banner.ok{background:var(--ok);border-color:var(--ok-b)}
.banner.info{background:var(--info);border-color:var(--info-b)}
.top + .banner{margin-left:20px;margin-right:20px}
.stage > .banner{margin:0 0 12px}
.risk-h{font-weight:700;margin-bottom:2px}
.cleaned{margin-top:4px;color:var(--sub)}
.busy{display:flex;gap:14px;align-items:center;justify-content:center;padding:90px 0;font-size:17px;color:var(--sub)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--pri);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

.bar{position:sticky;top:53px;z-index:15;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:12px;box-shadow:0 6px 14px -10px rgba(20,30,45,.35)}
.bar-file{display:flex;flex-direction:column;min-width:0;max-width:34%}
.bar-file strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-sum{flex:1;min-width:200px}
.bar-sum .big{font-size:20px;font-weight:700;margin-right:12px}
.bar-act{display:flex;gap:10px;align-items:center}
.sub{color:var(--sub);font-size:13px}
.bar-sum .sub{margin-right:10px}
.enc{font-size:12px;color:var(--sub)}
.enc select{font-size:12px;padding:1px 4px}

.controls{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 16px;margin-bottom:12px}
.ctl{display:flex;gap:14px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line2)}
.ctl:last-child{border-bottom:0}
.lab{flex:0 0 74px;color:var(--sub);font-size:13px;padding-top:4px}
.ctl .lab{padding-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center;flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#f4f6f9;color:var(--sub);border-radius:999px;padding:3px 13px;font-size:14px}
.chip.on{background:var(--pri-t);border-color:#8cc3cf;color:var(--pri-d);font-weight:600}
.chip em{font-style:normal;background:var(--pri);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;line-height:18px}
.chip.add{border-style:dashed;background:var(--panel);color:var(--pri)}
.chip.rule,.chip.col,.chip.tab{padding:0;gap:0;overflow:hidden}
.chip-main,.chip-x{background:none;border:0;padding:3px 12px;color:inherit;font:inherit}
.chip-x{padding:3px 10px 3px 6px;color:var(--sub);font-size:13px;border-left:1px solid rgba(0,0,0,.08)}
.chip-x:hover,.chip-main:hover{background:rgba(0,0,0,.05)}
.chip.col{background:var(--pri-t);border-color:#8cc3cf;color:var(--pri-d)}
.chip.col.masked{background:var(--mask);border-color:var(--mask);color:var(--mask-t)}
.chip.col.masked .chip-x{color:#fff;border-left-color:rgba(255,255,255,.3)}
.chip.col.off,.chip.tab.off{background:#f0f2f5;color:#8b95a3;text-decoration:line-through}
.chip.tab{background:#f4f6f9}
.chip.tab.cur{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip.tab.cur .chip-x{color:#fff}
.more{display:inline-block}
.more summary{cursor:pointer;color:var(--pri);padding:3px 6px;font-size:14px}
.chips.pop{margin-top:8px}

.work{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.tablecol{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.tools{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line2);font-size:13px}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.chk.inline{margin-left:8px;font-size:13px;color:var(--sub)}
.legend{margin-left:auto;color:var(--sub);font-size:12px}
.lg{font-style:normal;padding:0 4px;border-radius:3px}
.lg.m{background:var(--mask);color:var(--mask)}
.lg.i{background:var(--hl);color:var(--ink)}
.tablewrap{max-height:62vh;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{position:sticky;top:0;background:#f4f6f9;text-align:left;font-weight:600;padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
td{padding:6px 12px;border-bottom:1px solid var(--line2);vertical-align:top;max-width:340px;overflow-wrap:anywhere}
table.doc td.cell{max-width:none;white-space:pre-wrap}
td.rn,th.rn{color:#8b95a3;font-size:12px;width:1%;white-space:nowrap}
td.cell{cursor:pointer}
td.cell:hover{background:#f7fafb}
td.cell.sel{outline:2px solid var(--pri);outline-offset:-2px;background:#f2fafc}
.hit{display:inline;background:var(--mask);color:var(--mask-t);border-radius:3px;padding:1px 3px;margin:0 1px;cursor:pointer;font-family:ui-monospace,"Cascadia Mono","Noto Sans Mono CJK TC",Consolas,monospace;font-size:.93em}
.hit.low{background:#4a5666;box-shadow:inset 0 -2px 0 #e5b93d}
.hit.ign{background:var(--hl);color:var(--ink);font-family:inherit;font-size:1em;box-shadow:none}
.hit:hover{filter:brightness(1.25)}
.empty{padding:34px 26px;color:var(--sub);max-width:620px}
.more-btn{display:block;margin:12px auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 18px}

.detail{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:sticky;top:132px;max-height:76vh;overflow:auto}
.detail h3{margin:0 0 8px;font-size:15px}
.detail .lab{flex:none;padding:8px 0 3px}
.hint{color:var(--sub);margin:0}
.orig,.after{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fafbfc;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;user-select:text;max-height:200px;overflow:auto}
.orig u{text-decoration:none;background:#cfe7ee;border-radius:2px}
.orig u.ign{background:var(--hl)}
.after{background:#f4f5f7;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:13px}
.pickrow{display:flex;gap:10px;align-items:center;margin:8px 0 0;flex-wrap:wrap}
.hitlist{list-style:none;margin:0;padding:0;font-size:13px}
.hitlist li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:3px 0;border-bottom:1px dotted var(--line)}
.hitlist .ign{color:var(--sub);text-decoration:line-through}
.fine{max-width:1500px;margin:14px auto 0;color:var(--sub);font-size:12.5px}

.overlay{position:fixed;inset:0;background:rgba(20,28,40,.5);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.modal{background:var(--panel);border-radius:14px;width:min(560px,100%);box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.modal.wide{width:min(860px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0;font-size:18px}
.modal-b{padding:6px 20px 20px;max-height:80vh;overflow:auto}
.sect{padding:12px 0;border-bottom:1px solid var(--line2)}
.sect:last-child{border-bottom:0}
.sect h3,.aibox h3{margin:4px 0 8px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:4px 0}
.row.end{justify-content:flex-end;padding-top:14px}
.grow{flex:1;min-width:130px}
.row .ex{flex-basis:100%;color:var(--sub);font-size:12.5px;padding-left:24px;font-family:ui-monospace,Consolas,monospace}
.grid{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;align-items:center}
.grid > label{color:var(--sub);font-size:13px;align-self:start;padding-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],input[type=url],input[type=password],input[type=number],select,textarea{font:inherit;border:1px solid #b9c3cf;border-radius:7px;padding:5px 9px;background:#fff;color:var(--ink)}
.wide{width:100%}
.num{width:60px}
.txt{width:130px}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:13px}
textarea{resize:vertical}
.aibox{background:#f2f8fa;border:1px solid #bddbe3;border-radius:10px;padding:12px 14px;margin-top:10px}
.aiexp{margin-top:8px;padding:8px 10px;background:#fff;border-radius:8px;font-size:13.5px}
.aiexp:empty{display:none}
.refine{display:flex;gap:8px;margin-top:8px}
.refine:empty{display:none}
.warnline{color:#7a5a00}
.errline{color:#a8372d;font-size:13.5px;margin-top:6px}
.errline:empty{display:none}
.ruleform{margin-top:14px}
.testarea{margin-top:14px}
.tests{margin-top:8px;font-size:13.5px}
.tr{padding:2px 0;font-family:ui-monospace,"Noto Sans Mono CJK TC",Consolas,monospace;font-size:13px}
.tr.good{color:#1f6b3a}
.tr.bad{color:#a8372d;font-weight:600}

@media (max-width:1000px){
  .work{grid-template-columns:1fr}
  .detail{position:static;max-height:none}
  .bar{position:static}
  .bar-file{max-width:100%}
  .lab{flex-basis:60px}
}
@media (max-width:640px){
  .brand span{display:none}
  .grid{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  main{padding:12px}
}
@media print{.top,.bar-act{display:none}}

.modelrow{display:flex;gap:8px;align-items:center}
.modelrow input{flex:1}

.gsteps{list-style:none;counter-reset:g;margin:12px 0;padding:0}
.gstep{counter-increment:g;display:grid;grid-template-columns:34px 1fr;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.gstep::before{content:counter(g);grid-row:1/3;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.gtitle{font-weight:700}
.gbody{color:#38424f;font-size:14px}
.gnotes{margin:6px 0 0;padding-left:20px;font-size:14px;color:#38424f}
.gnotes li{margin:5px 0}
.guide h3{margin:16px 0 4px;font-size:15px}
.guide a{color:var(--pri)}

[hidden]{display:none!important}
button:disabled,input:disabled,select:disabled{opacity:.6}
input:disabled,select:disabled{background:#eef1f4;color:#5b6676;cursor:not-allowed}
.hint{margin:6px 0 4px}
.aistat{margin-top:10px;border:1px solid var(--line);border-left-width:5px;border-radius:8px;padding:8px 12px;background:#f7f8fa}
.aistat .st-h{font-weight:700;font-size:14px}
.aistat .st-d{margin-top:2px;font-size:13.5px;color:#38424f;overflow-wrap:anywhere}
.aistat .st-d.err{color:#a8372d}
.aistat .st-d.ok{color:#1f6b3a}
.aistat.ok{border-left-color:#2f9e5b;background:#eef8f1}
.aistat.warn{border-left-color:#e0a92a;background:#fff9e8}
.aistat.err{border-left-color:#d4574c;background:#fdf0ee}
.aistat.off{border-left-color:#9aa5b4}
.aibox.hintonly{background:#f4f6f9;border-color:var(--line);color:var(--sub);font-size:13.5px;padding:8px 14px}
.aibox.hintonly .errline{margin-top:4px}
.chip.add.ai{border-style:solid;border-color:#8cc3cf;background:var(--pri-t);color:var(--pri-d)}
.chip.add.ai b{background:var(--pri);color:#fff;border-radius:4px;padding:0 5px;font-size:11px;line-height:17px;margin-right:2px}

</style>
</head>

<div id="app"></div>

  }
  if (en.has('email')) each(R.email, t, m => add('email', m.index, m.index + m[0].length, 'high'));
  if (en.has('id')) {
    each(R.id, t, m => add('id', m.index, m.index + m[0].length, validId(m[0]) ? 'high' : 'low'));
    each(R.arc, t, m => add('id', m.index, m.index + m[0].length, 'low'));
  }
  if (en.has('phone')) {
    each(R.mobile, t, m => add('phone', m.index, m.index + m[0].length, 'high'));
    each(R.land, t, m => add('phone', m.index, m.index + m[0].length, /^\d+$/.test(m[0]) ? 'low' : 'high'));
  }
  if (en.has('ipv6')) each(R.ipv6, t, m => { if (validIPv6(m[0])) add('ipv6', m.index, m.index + m[0].length, 'high'); });
  if (en.has('ipv4')) each(R.ipv4, t, m => add('ipv4', m.index, m.index + m[0].length, 'high'));
  if (en.has('student')) each(R.student, t, m => add('student', m.index, m.index + m[0].length, 'high'));
  if (en.has('extension')) {
    if (hf.ext) each(R.ext5, t, m => add('extension', m.index, m.index + m[0].length, 'high'));
    else each(R.extCtx, t, m => add('extension', m.index + m[0].length - m[1].length, m.index + m[0].length, 'high'));
  }
  if (en.has('employee')) {
    const whole = /^\s*[139]\d{5}\s*$/.test(t);
    each(R.employee, t, m => add('employee', m.index, m.index + m[0].length, (hf.emp || whole) ? 'high' : 'low'));
  }
  if (en.has('birthday')) {
    if (hf.bday) each(R.date, t, m => add('birthday', m.index, m.index + m[0].length, 'high'));
    else each(R.bdayCtx, t, m => add('birthday', m.index + m[0].length - m[1].length, m.index + m[0].length, 'high'));
  }
  if (en.has('account')) {
    if (hf.acct && /^\s*[^\s]{2,40}\s*$/.test(t)) add('account', 0, t.length, 'high');
    else each(R.acctCtx, t, m => add('account', m.index + m[0].length - m[1].length, m.index + m[0].length, 'high'));
  }
  if (en.has('org') && hf.org && t.trim().length >= 2 && t.trim().length <= 40 && !/^[\d\s\-./]+$/.test(t.trim())) add('org', 0, t.length, 'high');
  if (en.has('address')) scanAddress(t, hf, add);
  if (en.has('name')) scanNames(t, text, hf, ctx, add);
  if (ctx.propRe) each(ctx.propRe, text, m => add('name', m.index, m.index + m[0].length, 'high', { src: 'propagated' }));
  return resolve(hits);
}

function scanAddress(t, hf, add) {
  if (hf.addr && /[路街巷弄號段村里]/.test(t) && t.trim().length >= 4) { add('address', 0, t.length, 'high'); return; }
  const ok = m => /[路街巷弄號段]/.test(m[0]);
  each(ADDR1, t, m => { if (ok(m)) add('address', m.index, m.index + m[0].length, 'high'); });
  each(ADDR2, t, m => { if (/號/.test(m[0])) add('address', m.index, m.index + m[0].length, 'high'); });
  each(ADDR3, t, m => {
    const lead = (ADDR_LEAD.exec(m[0]) || [''])[0].length;
    if (m[0].length - lead >= 4) add('address', m.index + lead, m.index + m[0].length, 'low');
  });
}

const CUT = /(電話|手機|信箱|郵件|地址|學號|系所|單位|職稱|身分證|分機|生日|聯絡|備註|辦公|傳真|帳號|電郵)/;
const LABEL_STRONG = '姓名|名字|聯絡人員|聯絡窗口|聯絡人|申請人|承辦人|負責人|填表人|當事人|提案人|監護人|家長|報告人|發言人|主持人|收件人|寄件人|收款人|持卡人|被保險人|申訴人|檢舉人|受訪者|受試者';
const LABEL_WEAK = '出席人員|出席|列席|請假|缺席|記錄|紀錄|主席|講者|講師|導師|指導教授|共同指導|撰寫|作者|召集人|委員|助教';
const RE_LABEL = new RegExp('(' + LABEL_STRONG + ')\\s*[:：]\\s*|(' + LABEL_WEAK + ')\\s*[:：]\\s*', 'g');
const RE_INTRO = new RegExp('(我是|我叫|本人是|本人為|敝姓|姓名是)', 'g');

const RE_LATIN_NAME = /^[A-Za-z][A-Za-z .'\-]{1,40}$/;

function scanNames(t, orig, hf, ctx, add) {
  // A. 姓名欄位：整格就是姓名
  if (hf.nameStrong || hf.nameWeak) {
    const trimmed = t.trim();
    if (hf.nameStrong && RE_LATIN_NAME.test(trimmed) && /[A-Za-z]{2}/.test(trimmed)) add('name', 0, t.length, 'high');
    else {
      const re = /[^、,，;；/／\s]+/g; let m;
      while ((m = re.exec(t))) {
        const st = stripTitle(m[0]);
        if ((hf.nameStrong ? looseName(st.name) : plausible(st.name))) add('name', m.index, m.index + st.name.length, 'high');
      }
    }
  }
  // B. 標籤後接姓名（姓名：王小明、李大華）
  each(RE_LABEL, t, m => {
    const strong = !!m[1];
    parseNameList(t, m.index + m[0].length, strong ? looseName : plausible, add, strong);
  });
  // C. 自我介紹
  each(RE_INTRO, t, m => {
    const p = m.index + m[0].length;
    const run = (new RegExp('^[' + CJ + ']+').exec(t.slice(p)) || [''])[0];
    if (!run) return;
    if (m[1] === '敝姓') {
      if (run.length >= 2 && COMPOUND.includes(run.slice(0, 2))) add('name', p, p + 2, 'high');
      else if (SURNAMES.has(run[0])) add('name', p, p + 1, 'high');
      return;
    }
    const st = stripTitle(run);
    for (const len of [3, 2, 4]) {
      const cand = st.name.slice(0, len);
      if (cand.length === len && strictName(cand)) {
        const rest = st.name.slice(len);
        add('name', p, p + len, rest === '' ? 'high' : 'low');
        return;
      }
    }
  });
  // D. 姓名 + 職稱（王小明老師、李主任）
  each(RE_TITLE, t, m => {
    const i = m.index;
    for (const len of [3, 2, 4]) {
      if (i - len < 0) continue;
      const cand = t.slice(i - len, i);
      if (RE_CJ_ONLY.test(cand) && strictName(cand)) { add('name', i - len, i, 'low'); return; }
    }
    if (i >= 1 && SURNAMES.has(t[i - 1]) && !(i >= 2 && COLLIDE_RE.test(t.slice(i - 2, i)))) add('name', i - 1, i, 'low');
  });
  // E. 孤立的 2–4 字詞（前後都不是中文字）
  each(RE_RUN, t, m => {
    if (m[0].length >= 2 && m[0].length <= 4 && strictName(m[0])) add('name', m.index, m.index + m[0].length, 'low');
  });
  // F. 補充姓名名單
  if (ctx.nameRe) each(ctx.nameRe, orig, m => add('name', m.index, m.index + m[0].length, 'high', { src: 'list' }));
}

function parseNameList(t, p, ok, add, allowLatin) {
  for (let guard = 0; guard < 8; guard++) {
    while (p < t.length && /[ \t]/.test(t[p])) p++;
    const rest = t.slice(p, p + 40);
    if (allowLatin) {
      const lm = /^[A-Za-z][A-Za-z .'\-]{1,30}/.exec(rest);
      if (lm && /[A-Za-z]{2}/.test(lm[0])) { const w = lm[0].replace(/\s+$/, ''); add('name', p, p + w.length, 'high'); p += lm[0].length; }
    }
    const m = new RegExp('^[' + CJ + ']+').exec(t.slice(p));
    if (!m) break;
    let run = m[0];
    const cut = CUT.exec(run);
    if (cut) run = run.slice(0, cut.index);
    const st = stripTitle(run);
    if (st.name.length >= 2 && st.name.length <= 4 && ok(st.name)) add('name', p, p + st.name.length, 'high');
    else break;
    p += run.length;
    const sep = /^\s*[、,，;；/／]\s*/.exec(t.slice(p));
    if (!sep) break;
    p += sep[0].length;
  }
}

function resolve(hits) {
  const sorted = hits.slice().sort((a, b) => ((PRI[a.kind] - PRI[b.kind]) || ((b.end - b.start) - (a.end - a.start)) || (a.start - b.start)));
  const out = [];
  for (const h of sorted) if (!out.some(o => h.start < o.end && o.start < h.end)) out.push(h);
  return out.sort((a, b) => a.start - b.start);
}

  return out + text.slice(cur);
}

/* ---------- 檔案輸入：CSV ---------- */
function decodeText(bytes, enc) {

}

  for (const c of [';', '\t']) if (cnt(c) > best) { best = cnt(c); delim = c; }
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"' && cell === '') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; rows.push(row); row = []; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }

}

}
function toCSV(rows) { return '\uFEFF' + rows.map(r => r.map(csvEscape).join(',')).join('\r\n') + '\r\n'; }

function normalizeGrid(grid, sheetName) {
  while (grid.length && grid[grid.length - 1].every(c => String(c || '').trim() === '')) grid.pop();
  if (!grid.length) throw new UserError('「' + sheetName + '」沒有資料。');
  const w = Math.max(...grid.map(r => r.length));
  let lastCol = w - 1;
  while (lastCol >= 0 && grid.every(r => String(r[lastCol] || '').trim() === '')) lastCol--;
  const width = lastCol + 1;
  const rows = grid.map(r => { const x = []; for (let i = 0; i < width; i++) x.push(r[i] == null ? '' : String(r[i])); return x; });
  const seen = new Map();
  const headers = rows[0].map((h, i) => {
    let n = String(h).trim() || ('欄位' + (i + 1));
    if (seen.has(n)) { const k = seen.get(n) + 1; seen.set(n, k); n = n + '_' + k; } else seen.set(n, 1);
    return n;
  });
  return { name: sheetName, headers, rows: rows.slice(1) };
}

/* ---------- 檔案輸入：HTML 偽 xls ---------- */
function parseHtmlTables(text) {
  const d = new DOMParser().parseFromString(text, 'text/html');
  const tables = Array.from(d.querySelectorAll('table'));
  if (!tables.length) throw new UserError('這個檔案看起來是網頁格式，但找不到表格。請在 Excel 另存為 .xlsx 或 CSV。');
  return tables.map((tb, i) => normalizeGrid(
    Array.from(tb.querySelectorAll('tr')).map(tr => Array.from(tr.children).map(c => c.textContent.replace(/\s+/g, ' ').trim())),
    '表格' + (i + 1)));
}

/* ---------- ZIP 共用 ---------- */
function guardZip(zip) {
  let n = 0, total = 0;
  zip.forEach((p, f) => {
    n++;
    const sz = (f._data && f._data.uncompressedSize) || 0;
    total += sz;
    if (sz > 200e6) throw new UserError('檔案內含過大的部件，為避免瀏覽器當機已停止處理。請拆分檔案後再試。');
  });
  if (n > 5000 || total > 500e6) throw new UserError('檔案結構過大或異常，為避免瀏覽器當機已停止處理。請拆分檔案後再試。');
}
function parseXml(str) {
  if (/<!DOCTYPE|<!ENTITY/i.test(str)) throw new UserError('檔案含有不安全的 XML 宣告，已停止處理。');
  const d = new DOMParser().parseFromString(str, 'application/xml');
  if (d.getElementsByTagName('parsererror').length) throw new UserError('檔案內部格式損毀，無法讀取。請用 Office 重新另存後再試。');
  return d;
}
function serXml(d) {
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + new XMLSerializer().serializeToString(d).replace(/^<\?xml[^>]*\?>\s*/, '');
}
async function readXml(zip, path) {
  const f = zip.file(path);
  if (!f) return null;
  return parseXml(await f.async('string'));
}
const attrByLocal = (el, local) => { for (const a of Array.from(el.attributes)) if (a.localName === local || a.name.endsWith(':' + local)) return a.value; return null; };

/* ---------- 檔案輸入：XLSX ---------- */
function colIndex(ref) {
  const m = /^([A-Z]+)/i.exec(ref || ''); if (!m) return -1;
  let n = 0; for (const ch of m[1].toUpperCase()) n = n * 26 + ch.charCodeAt(0) - 64;
  return n - 1;
}
function excelDate(v, d1904) {
  const num = parseFloat(v); if (!isFinite(num)) return v;
  const dt = new Date(Math.round((num - (d1904 ? 24107 : 25569)) * 86400000));
  if (isNaN(dt)) return v;
  const p = n => String(n).padStart(2, '0');
  const date = dt.getUTCFullYear() + '-' + p(dt.getUTCMonth() + 1) + '-' + p(dt.getUTCDate());
  return (num % 1 === 0) ? date : date + ' ' + p(dt.getUTCHours()) + ':' + p(dt.getUTCMinutes()) + ':' + p(dt.getUTCSeconds());
}
function isDateFmt(id, code) {
  if ((id >= 14 && id <= 22) || (id >= 27 && id <= 36) || (id >= 45 && id <= 47) || (id >= 50 && id <= 58)) return true;
  if (!code) return false;
  const c = code.replace(/"[^"]*"/g, '').replace(/\[[^\]]*\]/g, '').replace(/\\./g, '');
  return /[ymdhs]/i.test(c) && !/^general$/i.test(c.trim());
}
function resolveTarget(relsPath, target) {
  if (target.startsWith('/')) return target.slice(1);
  const base = relsPath.replace(/_rels\/[^/]*$/, '');
  const parts = (base + target).split('/'); const out = [];
  for (const p of parts) { if (p === '..') out.pop(); else if (p !== '.' && p !== '') out.push(p); }
  return out.join('/');
}
async function parseXlsx(bytes) {
  let zip;
  try { zip = await JSZip.loadAsync(bytes); } catch (e) { throw new UserError('無法開啟這個 XLSX（可能已損毀或有密碼保護）。請在 Excel 重新另存為 .xlsx 後再試。'); }
  guardZip(zip);
  const wb = await readXml(zip, 'xl/workbook.xml');
  if (!wb) throw new UserError('這不是有效的 XLSX 檔案。請在 Excel 另存為 .xlsx 或 CSV。');
  const d1904 = Array.from(wb.getElementsByTagName('workbookPr')).some(e => /^(1|true)$/i.test(e.getAttribute('date1904') || ''));
  const relsDoc = await readXml(zip, 'xl/_rels/workbook.xml.rels');
  const relMap = {};
  if (relsDoc) for (const r of Array.from(relsDoc.getElementsByTagName('Relationship'))) relMap[r.getAttribute('Id')] = resolveTarget('xl/_rels/workbook.xml.rels', r.getAttribute('Target'));
  const shared = [];
  const ssDoc = await readXml(zip, 'xl/sharedStrings.xml');
  if (ssDoc) for (const si of Array.from(ssDoc.getElementsByTagName('si'))) {
    shared.push(Array.from(si.getElementsByTagName('t')).filter(t => !(t.parentNode && t.parentNode.localName === 'rPh')).map(t => t.textContent).join(''));
  }
  const dateXf = new Set();
  const stDoc = await readXml(zip, 'xl/styles.xml');

    const custom = {};
    for (const nf of Array.from(stDoc.getElementsByTagName('numFmt'))) custom[nf.getAttribute('numFmtId')] = nf.getAttribute('formatCode');
    const cx = stDoc.getElementsByTagName('cellXfs')[0];
    if (cx) Array.from(cx.getElementsByTagName('xf')).forEach((xf, i) => {

    if (!path || !zip.file(path)) continue;
    const doc = await readXml(zip, path);
    const grid = [];
    for (const row of Array.from(doc.getElementsByTagName('row'))) {
      const rIdx = (+row.getAttribute('r') || grid.length + 1) - 1;
      if (rIdx > 200000) throw new UserError('「' + name + '」列數過多（超過 20 萬列），請拆分後再試。');
      const arr = grid[rIdx] || (grid[rIdx] = []);
      let seq = 0;
      for (const c of Array.from(row.getElementsByTagName('c'))) {
        let ci = colIndex(c.getAttribute('r')); if (ci < 0) ci = seq; seq = ci + 1;
        if (ci > 2000) continue;
        const t = c.getAttribute('t'), vEl = c.getElementsByTagName('v')[0], v = vEl ? vEl.textContent : '';
        let val = '';
        if (t === 's') val = shared[+v] != null ? shared[+v] : '';
        else if (t === 'inlineStr') val = Array.from(c.getElementsByTagName('t')).map(x => x.textContent).join('');
        else if (t === 'b') val = v === '1' ? 'TRUE' : 'FALSE';
        else if (t === 'e') val = '';
        else if (t === 'str') val = v;
        else if (v !== '' && dateXf.has(+c.getAttribute('s'))) val = excelDate(v, d1904);
        else val = v;
        arr[ci] = val;
      }

    for (let i = 0; i < grid.length; i++) { if (!grid[i]) grid[i] = []; for (let j = 0; j < grid[i].length; j++) if (grid[i][j] == null) grid[i][j] = ''; }
    if (!grid.length || grid.every(r => r.every(x => String(x).trim() === ''))) continue;

  }
  if (!sheets.length) throw new UserError('這個 XLSX 裡沒有可處理的資料。');
  return sheets;
}

/* ---------- 檔案輸出：XLSX / CSV ---------- */

async function removePart(zip, path) {

  // 6) 風險
  const media = names.filter(n => /^word\/media\//i.test(n));
  if (media.length) risks.push({ label: '圖片 ' + media.length + ' 張', note: '圖片內的文字與照片中繼資料（如拍攝位置）不會被處理，請開啟匯出檔逐頁確認。' });

function ctxHeader(p) {
  let n = p;

  const tr = n.parentNode, tbl = tr && tr.parentNode;

async function docxToSheet(bytes) {

  const ov = h('div', { class: 'overlay', onmousedown: e => { if (e.target === ov) close(); } },

      h('label', { class: 'chk grow' }, h('input', { type: 'checkbox', checked: st.enabled.includes(t.kind), onchange: e => { const i = st.enabled.indexOf(t.kind); if (e.target.checked && i < 0) st.enabled.push(t.kind); if (!e.target.checked && i >= 0) st.enabled.splice(i, 1); commit(); } }), t.label),

        [['default', '預設'], ['full', '全部遮罩'], ['partial', '保留前後字'], ['replace', '取代為文字']].map(([v, l]) => h('option', { value: v, selected: (pol().mode || 'default') === v }, l))),

  // 2. 自訂規則
  const rulesBox = h('div', {});
  const drawRules = () => {

  // 3. 補充姓名名單

        const set = new Set(ta.value.split(/[\n,，、;；\t]+/).map(s => s.trim()).filter(s => /^[\u3400-\u4dbf\u4e00-\u9fff]{2,4}$/.test(s)));
        S.names = Array.from(set).slice(0, 5000); ta.value = S.names.join('\n'); tip.textContent = '已套用 ' + S.names.length + ' 個姓名（已去除重複與無效項目）'; if (S.sheets.length) { rescan(); render(); }
      } }, '套用'), tip)));

  // 4. AI 連線
  const a = st.ai;
  let detail = { cls: '', text: '' };
  const STAT_CLS = { ready: 'ok', untested: 'warn', unconfigured: 'off', offline: 'off', rejected: 'err', error: 'err' };

  const applyLock = () => {
    const lock = aiCfgOK() && S.aiAuth === 'ok' && !S.aiUnlock;     // 驗證成功後鎖住欄位，避免誤改誤刪
    lockables.forEach(el => { el.disabled = lock; });
    unlockBtn.hidden = !lock;
  };
  const drawAI = () => {
    const s = aiState();
    const dtext = detail.text || (s === 'ready' ? '' : AI_TEXT[s][1]);
    statusBox.className = 'aistat ' + STAT_CLS[s];
    fill(statusBox, h('div', { class: 'st-h' }, AI_TEXT[s][0]), dtext ? h('div', { class: 'st-d ' + detail.cls }, dtext) : null);
    applyLock();
  };
  const changed = () => { aiReset(); detail = { cls: '', text: '' }; saveSettings(); drawHint(); drawAI(); render(); };
  S.aiWatchers.push(drawAI);
  const keyIn = h('input', { type: 'password', class: 'wide', autocomplete: 'off', value: getKey(), placeholder: a.provider === 'openai' ? '（本機模型可留空）' : '貼上 API 金鑰', onchange: e => { setKey(e.target.value, a.remember); e.target.value = getKey(); changed(); } });
  const epIn = h('input', { type: 'url', class: 'wide', value: a.endpoint, onchange: e => { a.endpoint = e.target.value.trim(); presetSel.value = guessPreset(); changed(); } });
  const mdIn = h('input', { type: 'text', class: 'wide', value: a.model, onchange: e => { a.model = e.target.value.trim(); changed(); } });
  const dl = h('datalist', { id: 'modellist' });
  mdIn.setAttribute('list', 'modellist'); mdIn.setAttribute('autocomplete', 'off');
  const hintOut = h('p', { class: 'sub hint' });
  const drawHint = () => { hintOut.textContent = isLocalEndpoint() ? LOCAL_HINT : (PROVIDER_HINT[a.provider] || ''); };
  const provSel = h('select', { onchange: e => { a.provider = e.target.value; presetSel.value = guessPreset(); changed(); } },
    h('option', { value: 'anthropic', selected: a.provider === 'anthropic' }, 'Anthropic Messages（Claude）'),
    h('option', { value: 'openai', selected: a.provider === 'openai' }, 'OpenAI Chat Completions（相容服務、本機模型）'),
    h('option', { value: 'gemini', selected: a.provider === 'gemini' }, 'Google Gemini'),
    h('option', { value: 'azure', selected: a.provider === 'azure' }, 'Azure OpenAI'));
  const guessPreset = () => Object.keys(AI_PRESETS).find(k => AI_PRESETS[k].endpoint === a.endpoint && AI_PRESETS[k].provider === a.provider) || 'custom';
  const presetSel = h('select', { onchange: e => {
    const p = AI_PRESETS[e.target.value]; if (!p) return;
    a.provider = p.provider; a.endpoint = p.endpoint; a.model = p.model;
    epIn.value = a.endpoint; mdIn.value = a.model; provSel.value = a.provider; changed();
    if (a.provider !== 'azure' && (getKey() || e.target.value === 'local') && !a.model) pullModels();
  } },
    h('option', { value: 'custom', selected: guessPreset() === 'custom' }, '自訂'),
    h('option', { value: 'official', selected: guessPreset() === 'official' }, 'Anthropic 官方 API'),
    h('option', { value: 'gemini', selected: guessPreset() === 'gemini' }, 'Google Gemini'),
    h('option', { value: 'openai-official', selected: guessPreset() === 'openai-official' }, 'OpenAI 官方 API'),
    h('option', { value: 'azure', selected: guessPreset() === 'azure' }, 'Azure OpenAI'),
    h('option', { value: 'local', selected: guessPreset() === 'local' }, '本機模型（離線可用）'));
  const pullBtn = h('button', { class: 'ghost small', onclick: () => pullModels() }, '取得模型清單');
  const remChk = h('input', { type: 'checkbox', checked: !!a.remember, onchange: e => { a.remember = e.target.checked; setKey(keyIn.value, a.remember); saveSettings(); } });
  lockables.push(presetSel, provSel, epIn, mdIn, keyIn, pullBtn, remChk);
  async function pullModels() {
    setKey(keyIn.value, a.remember); keyIn.value = getKey();
    detail = { cls: '', text: '取得模型清單中…' }; drawAI();
    try {
      const ids = await fetchModels();
      dl.replaceChildren(...ids.map(id => h('option', { value: id })));
      detail = { cls: '', text: '找到 ' + ids.length + ' 個模型。點「模型名稱」欄位選取：' + ids.slice(0, 6).join('、') + (ids.length > 6 ? '…' : '') };
      if (!a.model) mdIn.focus();
    } catch (e) { detail = { cls: 'err', text: e.message }; }
    drawAI(); render();
  }
  const testBtn = h('button', { class: 'ghost', onclick: async () => {
    setKey(keyIn.value, a.remember); keyIn.value = getKey(); aiReset(); drawHint();
    detail = { cls: '', text: '測試中…' }; drawAI();
    try { await aiRequest('請只回覆 {"ok":true}', []); S.aiUnlock = false; detail = { cls: 'ok', text: '連線成功，金鑰有效。連線設定已鎖定，要修改請按「修改連線設定」。' }; }
    catch (e) { detail = { cls: 'err', text: e.message }; }
    drawAI(); render();
  } }, '測試連線');
  body.append(dl);
  body.append(sect('ai', 'AI 連線（選用）',
    h('p', { class: 'sub' }, 'AI 只把你用白話描述的規則轉成遮罩規則，不會收到匯入的檔案內容。離線時自動關閉（本機模型除外）。'),
    h('div', { class: 'grid' },
      h('label', {}, '快速填入'), presetSel,
      h('label', {}, '服務類型'), provSel,
      h('label', {}, '連線網址'), epIn,
      h('label', {}, '模型名稱'), h('div', { class: 'modelrow' }, mdIn, pullBtn),
      h('label', {}, 'API 金鑰'), keyIn),
    hintOut,
    h('label', { class: 'chk' }, remChk, '記住金鑰（共用電腦請勿勾選）'),
    h('div', { class: 'row' }, testBtn, unlockBtn, h('button', { class: 'plain', onclick: openAIGuide }, 'Gemini API 操作指引')),
    statusBox));
  drawHint(); drawAI();

  // 5. 設定備份
  const fi = h('input', { type: 'file', accept: '.json', class: 'sr', onchange: async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const j = JSON.parse(PM.decodeText(await readBytes(f), 'auto').text);
      if (j.schema !== 'pii-mask-settings-v1') throw 0;
      if (Array.isArray(j.enabled)) st.enabled = j.enabled.filter(k => PM.KIND_LABEL[k]);
      if (j.policies) st.policies = j.policies;
      if (j.symbol) st.symbol = String(j.symbol).slice(0, 1);
      if (Array.isArray(j.rules)) j.rules.filter(r => PM.validateRule(r).ok).forEach(r => { r.id = 'r' + Date.now() + (ruleSeq++); st.rules.push(r); });
      commit(); alert('已匯入設定。'); document.querySelector('.overlay .modal-h .plain').click(); openSettings();
    } catch (err) { alert('這不是有效的設定檔。'); }
    e.target.value = '';
  } });
  body.append(sect('backup', '設定備份',
    h('p', { class: 'sub' }, '只包含類型、遮罩方式與自訂規則；不含任何檔案內容、姓名名單或金鑰。'),
    h('div', { class: 'row' },
      h('button', { class: 'ghost', onclick: () => download(new TextEncoder().encode(JSON.stringify({ schema: 'pii-mask-settings-v1', enabled: st.enabled, policies: st.policies, symbol: st.symbol, rules: st.rules }, null, 2)), '個資遮罩設定.json', 'application/json') }, '匯出設定'),
      h('button', { class: 'ghost', onclick: () => fi.click() }, '匯入設定'), fi)));

  const m = openModal('設定', body, { wide: true, onClose: () => { S.aiWatchers = S.aiWatchers.filter(f => f !== drawAI); } });
  if (focus) { const t = m.el.querySelector('#sec-' + focus); if (t) t.scrollIntoView(); }
}

/* ---------- 新增／編輯自訂規則（含 AI 助理） ---------- */
function openRuleDialog(rule, after, opts) {
  const editing = !!rule;
  const d = rule ? JSON.parse(JSON.stringify(rule)) : { id: 'r' + Date.now() + (ruleSeq++), name: '', mode: 'literal', value: '', ignoreCase: false, mask: { mode: 'full', front: 1, back: 1, replace: '' }, enabled: true, confidence: 'high', scope: 'persistent' };
  d.mask = Object.assign({ mode: 'full', front: 1, back: 1, replace: '' }, d.mask || {});
  d.pattern = '';
  let history = [], pos = d.pos || [], neg = d.neg || [];
  const body = h('div', { class: 'ruledlg' });

  /* AI 區：可用時顯示輸入區；不可用時只顯示一行提示 */
  const aiBox = h('div', { class: 'aibox' });
  const desc = h('textarea', { rows: 3, class: 'wide', placeholder: '例如：計畫代碼，長得像 NSC-114-0012，前面是英文縮寫、中間是年度、最後是四碼流水號', maxlength: 1200 });
  const aiMsg = h('div', { class: 'sub', role: 'status' });
  const aiExp = h('div', { class: 'aiexp' });
  const askBtn = h('button', { class: 'primary small', onclick: () => ask() }, '請 AI 設定規則');
  const refine = h('div', { class: 'refine' });
  let lastErr = '';
  const drawAI = () => {
    const s = aiState();
    if (aiUsable()) {
      aiBox.className = 'aibox';
      fill(aiBox, h('h3', {}, '用說的建立規則（AI 協助）'), desc, h('div', { class: 'row' }, askBtn), aiMsg, aiExp, refine);
      askBtn.disabled = false;
      if (!aiMsg.textContent || aiMsg.className === 'sub') { aiMsg.className = 'sub'; aiMsg.textContent = (s === 'untested' ? '尚未驗證金鑰；送出後若被拒，會在這裡告訴你原因。　' : '') + 'AI 只會收到上面這段描述，看不到你匯入的檔案。請不要輸入真實個資。'; }
    } else {
      aiBox.className = 'aibox hintonly';
      const need = s === 'unconfigured' || s === 'rejected' || s === 'error';
      fill(aiBox,
        s === 'offline' ? '目前離線，AI 輔助暫時關閉。' : s === 'rejected' ? 'AI 金鑰或權限被拒。' : s === 'error' ? 'AI 連線失敗。' : 'AI 輔助尚未啟用。',
        need ? ['如需 AI 輔助生成規則，', h('button', { class: 'plain', onclick: () => openSettings('ai') }, '請點此設定 API'), '。'] : null,
        lastErr && (s === 'rejected' || s === 'error') ? h('div', { class: 'errline' }, lastErr) : null);
    }
  };
  S.aiWatchers.push(drawAI);
  async function ask(feedback) {
    askBtn.disabled = true; aiMsg.className = 'sub busy'; aiMsg.textContent = 'AI 設定中…'; lastErr = '';
    try {
      const text = feedback ? '請依下列意見調整規則，仍然只輸出 JSON：' + feedback : desc.value.trim();
      if (!text) throw new PM.UserError('請先用白話描述你想遮罩的內容。');
      const raw = await aiRequest(text, history);
      const out = parseAIRule(raw);
      history = history.concat([{ role: 'user', content: text }, { role: 'assistant', content: raw }]).slice(-6);
      d.name = out.name; d.mode = out.mode; d.value = out.value; d.ignoreCase = out.ignoreCase; d.mask = out.mask; pos = out.pos; neg = out.neg;
      fill(aiExp, h('b', {}, 'AI 的說明：'), out.explanation || '（沒有提供）');
      drawForm(); drawRefine(); drawTests();
      aiMsg.className = 'sub'; aiMsg.textContent = '已填入下方表單。請看一下「試跑結果」，確認沒問題再儲存。';
    } catch (e) { lastErr = e.message; aiMsg.className = 'sub errline'; aiMsg.textContent = e.message; }
    drawAI(); askBtn.disabled = !aiUsable();
  }
  const drawRefine = () => {
    const fb = h('input', { type: 'text', class: 'wide', placeholder: '要調整嗎？例如：沒抓到沒有連字號的；不要抓到小寫的', maxlength: 300 });
    fill(refine, fb, h('button', { class: 'ghost small', disabled: !aiUsable(), onclick: () => { if (fb.value.trim()) ask(fb.value.trim()); } }, '請 AI 調整'));
  };

  /* 表單區 */
  const form = h('div', { class: 'ruleform' });
  const err = h('div', { class: 'errline', role: 'alert' });
  const testBox = h('div', { class: 'tests' });
  const patIn = h('textarea', { rows: 4, class: 'wide mono', oninput: e => { d.value = e.target.value; drawTests(); } });
  function drawForm() {
    patIn.value = d.value;
    patIn.placeholder = d.mode === 'literal' ? '一行一個要遮罩的文字' : '例如：NSC-\\d{3}-\\d{4}';
    nameIn.value = d.name;
    modeSel.value = d.mode; ci.checked = !!d.ignoreCase; mkSel.value = d.mask.mode;
    drawMaskExtra();
    lab.textContent = d.mode === 'literal' ? '要遮罩的文字（一行一個）' : '正規表示式（進階）';
  }
  const nameIn = h('input', { type: 'text', class: 'wide', maxlength: 30, placeholder: '例如：專案代碼', oninput: e => { d.name = e.target.value; } });
  const modeSel = h('select', { onchange: e => { d.mode = e.target.value; drawForm(); drawTests(); } }, h('option', { value: 'literal' }, '固定文字'), h('option', { value: 'regex' }, '格式規則（正規表示式）'));
  const ci = h('input', { type: 'checkbox', onchange: e => { d.ignoreCase = e.target.checked; drawTests(); } });
  const mkExtra = h('span', {});
  const drawMaskExtra = () => {
    fill(mkExtra);
    if (d.mask.mode === 'partial') mkExtra.append(' 保留前 ', h('input', { type: 'number', min: 0, max: 20, class: 'num', value: d.mask.front, onchange: e => { d.mask.front = +e.target.value; drawTests(); } }), ' 後 ', h('input', { type: 'number', min: 0, max: 20, class: 'num', value: d.mask.back, onchange: e => { d.mask.back = +e.target.value; drawTests(); } }), ' 字');
    if (d.mask.mode === 'replace') mkExtra.append(' 取代為 ', h('input', { type: 'text', class: 'txt', maxlength: 30, value: d.mask.replace, placeholder: '〔已遮罩〕', onchange: e => { d.mask.replace = e.target.value; drawTests(); } }));
  };
  const mkSel = h('select', { onchange: e => { d.mask.mode = e.target.value; drawMaskExtra(); drawTests(); } }, [['full', '全部遮罩'], ['partial', '保留前後字'], ['replace', '取代為文字']].map(([v, l]) => h('option', { value: v }, l)));
  const lab = h('label', {});
  const scopeSel = h('select', { onchange: e => { d.scope = e.target.value; } }, h('option', { value: 'persistent' }, '長期保存（下次也能用）'), h('option', { value: 'temporary' }, '只用這一次'));
  scopeSel.value = d.scope;
  form.append(
    h('div', { class: 'grid' }, h('label', {}, '規則名稱'), nameIn, h('label', {}, '比對方式'), h('div', {}, modeSel, ' ', h('label', { class: 'chk inline' }, ci, '英文大小寫視為相同')), lab, patIn,
      h('label', {}, '遮罩方式'), h('div', {}, mkSel, mkExtra), h('label', {}, '保存'), scopeSel));

  /* 本機試跑（不會送給 AI） */
  const posIn = h('textarea', { rows: 3, class: 'wide', placeholder: '應該被遮罩的例子，一行一個（虛構即可）', oninput: e => { pos = e.target.value.split(/\r?\n/).filter(Boolean); drawTests(); } }, pos.join('\n'));
  const negIn = h('textarea', { rows: 3, class: 'wide', placeholder: '不該被遮罩的例子，一行一個', oninput: e => { neg = e.target.value.split(/\r?\n/).filter(Boolean); drawTests(); } }, neg.join('\n'));
  function drawTests() {
    posIn.value !== pos.join('\n') && (posIn.value = pos.join('\n')); negIn.value !== neg.join('\n') && (negIn.value = neg.join('\n'));
    const v = PM.validateRule(Object.assign({}, d, { name: d.name || 'x' }));
    if (!v.ok) { fill(testBox, h('div', { class: 'errline' }, d.value ? v.error : '')); return; }
    const c = PM.compileRule(Object.assign({}, d, { name: d.name || 'x', enabled: true }));
    const run = s => { c.re.lastIndex = 0; const m = c.re.exec(s); return m ? m[0] : null; };
    const maskedOf = (s, m) => PM.applyHits(s, [{ start: s.indexOf(m), end: s.indexOf(m) + m.length, kind: 'custom', original: m, policy: d.mask }], x => PM.maskValue('custom', x.original, d.mask, S.settings.symbol));
    fill(testBox,
      pos.length || neg.length ? h('div', { class: 'lab' }, '試跑結果（只在本機執行）') : h('div', { class: 'sub' }, '在上面填幾個例子，就能看到這條規則的實際效果。'),
      pos.map(s => { const m = run(s); return h('div', { class: 'tr ' + (m ? 'good' : 'bad') }, m ? '✓ ' : '✗ 沒抓到：', m ? maskedOf(s, m) : s); }),
      neg.map(s => { const m = run(s); return h('div', { class: 'tr ' + (m ? 'bad' : 'good') }, m ? '✗ 誤抓：' : '✓ 不會遮罩：', m ? maskedOf(s, m) : s); }));
  }

  body.append(aiBox, form, h('div', { class: 'testarea' }, h('div', { class: 'grid2' }, h('div', {}, h('div', { class: 'lab' }, '應該被遮罩的例子'), posIn), h('div', {}, h('div', { class: 'lab' }, '不該被遮罩的例子'), negIn)), testBox), err);
  const modal = openModal(editing ? '編輯規則' : '新增自訂規則', body, { wide: true, onClose: () => { S.aiWatchers = S.aiWatchers.filter(f => f !== drawAI); } });
  const saveBtn = h('button', { class: 'primary', onclick: async () => {
    err.textContent = '';
    d.name = nameIn.value.trim(); d.value = patIn.value;
    const v = PM.validateRule(d);
    if (!v.ok) { err.textContent = v.error; return; }
    if (d.mode === 'regex') {
      saveBtn.disabled = true; saveBtn.textContent = '安全檢查中…';
      const r = await regexTimeCheck(d, pos.concat(neg));
      saveBtn.disabled = false; saveBtn.textContent = '儲存並套用';
      if (!r.ok) { err.textContent = '這條規則在測試中執行過久，可能會讓程式卡住，因此不能使用。請把規則寫得更簡單、更明確。'; return; }
    }
    const out = { id: d.id, name: d.name, mode: d.mode, value: d.value, pattern: d.mode === 'regex' ? d.value : '', ignoreCase: !!d.ignoreCase, mask: d.mask, enabled: true, confidence: 'high', scope: d.scope };
    if (d.scope === 'temporary') {
      S.settings.rules = S.settings.rules.filter(r => r.id !== d.id);
      S.temp = S.temp.filter(r => r.id !== d.id).concat([out]);
    } else {
      S.temp = S.temp.filter(r => r.id !== d.id);
      const i = S.settings.rules.findIndex(r => r.id === d.id);
      if (i >= 0) S.settings.rules[i] = out; else S.settings.rules.push(out);
      saveSettings();
    }
    if (S.sheets.length) rescan();
    modal.close(); render(); if (after) after();
  } }, '儲存並套用');
  body.append(h('div', { class: 'row end' }, h('button', { class: 'ghost', onclick: () => modal.close() }, '取消'), saveBtn));
  drawForm(); drawAI(); drawTests(); if (editing) drawRefine();
  if (opts && opts.ai && aiUsable()) setTimeout(() => desc.focus(), 0);
}

/* =========================================================
 * 啟動
 * ========================================================= */
function init() {
  S.settings = loadSettings();
  const app = $('#app');
  render();
  window.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
  window.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
  window.addEventListener('drop', e => {
    e.preventDefault(); document.body.classList.remove('dragging');
    const fs = e.dataTransfer && e.dataTransfer.files;
    if (fs && fs.length) { if (fs.length > 1) S.msg = { type: 'info', text: '一次處理一個檔案，已先處理「' + fs[0].name + '」。其餘請匯出後再換檔。' }; loadFile(fs[0]); }
  });
  const onNet = () => { if (navigator.onLine) S.aiFail = false; notifyAI(); render(); };
  window.addEventListener('online', onNet); window.addEventListener('offline', onNet);
  document.addEventListener('selectionchange', () => { if ($('#orig')) updatePick(); });
  if (app) app.dataset.ready = '1';
}
globalThis.PMApp = { S, init, loadFile, rescan, doExport, aiState, guardOutgoing, parseAIRule, aiRequest, render };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
